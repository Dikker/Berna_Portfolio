<!-- FamilyAndCircles.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family & Circles - Ma. Bernadette Pascua</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Ma. Bernadette Pascua</h1>
        <p>9 - St. Padre Pio</p>
    </header>

    <nav>
        <a href="LandingPage.html">Home</a>
        <a href="AboutMe.html">About Me</a>
        <a href="MyPassion.html">My Passion</a>
        <a href="FamilyAndCircles.html" class="active">Family & Circles</a>
    </nav>

    <main>
        <!-- 1. BULLETIN BOARD VIEW (Folder Selection) -->
        <section class="bulletin-board" id="bulletinBoard">
            <h2>Family & Circles Bulletin</h2>
            <p class="bulletin-sub">Click a folder to view photos and memories!</p>

            <div class="folder-grid">
                <div class="folder-card" onclick="openFolder('family')">
                    <i class="fa-solid fa-folder-open folder-icon"></i>
                    <h3>Family</h3>
                </div>

                <div class="folder-card" onclick="openFolder('scallywag')">
                    <i class="fa-solid fa-folder-open folder-icon"></i>
                    <h3>Scallywag</h3>
                </div>

                <div class="folder-card" onclick="openFolder('choir')">
                    <i class="fa-solid fa-folder-open folder-icon"></i>
                    <h3>Choir</h3>
                </div>

                <div class="folder-card" onclick="openFolder('friends')">
                    <i class="fa-solid fa-folder-open folder-icon"></i>
                    <h3>Friends</h3>
                </div>

                <div class="folder-card" onclick="openFolder('taekwondo')">
                    <i class="fa-solid fa-folder-open folder-icon"></i>
                    <h3>Taekwondo</h3>
                </div>
            </div>
        </section>

        <!-- 2. GALLERY VIEW (Inside Folder) -->
        <section class="gallery-container" id="galleryView" style="display: none;">
            <div class="gallery-header">
                <button class="back-btn" onclick="closeFolder()">⬅ Back to Folders</button>
                <h2 id="folderTitle">Folder Name</h2>
            </div>

            <!-- Horizontal Polaroid Gallery -->
            <div class="polaroid-horizontal" id="polaroidList">
                <!-- Polaroid items will be generated here dynamically by JS -->
            </div>

            <!-- Description Button -->
            <div class="gallery-footer">
                <button class="desc-btn" onclick="showDescriptionModal()">📖 Read Description</button>
            </div>
        </section>
    </main>

    <!-- IMAGE ZOOM LIGHTBOX MODAL -->
    <div class="image-modal" id="imageModal" onclick="closeImageModal()">
        <div class="modal-content-img" onclick="event.stopPropagation()">
            <img id="zoomedImage" src="" alt="Zoomed Photo">
        </div>
    </div>

    <!-- DESCRIPTION MESSAGE BOX MODAL -->
    <div class="desc-modal" id="descModal">
        <div class="desc-modal-content">
            <button class="modal-close-btn" onclick="closeDescriptionModal()">✖</button>
            <h2 id="descTitle">About This Group</h2>
            <p id="descText">Group description goes here.</p>
        </div>
    </div>

    <footer>
        <p>™ Gawa ni cute</p>
    </footer>

    <script>
        // Folder Data
        const folderData = {
            family: {
                title: "My Family",
                description: "This is my mom, and my brother. The people who watched me grow up, taught me discipline, whom the people I love so much, and the people who will always be there for me no matter what.",
                photos: [
                    { src: "family1.jpg", caption: "Family Outing" },
                    { src: "family2.jpg", caption: "Dinner Time" },
                    { src: "family3.jpg", caption: "Sunday Mass" },
                    { src: "family4.jpg", caption: "Celebration" }
                ]
            },
            scallywag: {
                title: "Scallywag (SLCV Dance Company)",
                description: "I'm so glad that I met these peeps, especially my ate's and kuya's, but we all had to walk on our own paths. However, we were still able to cross our paths and hangout again whenever we had time. I love these people so much, I love performing and practicing with them, and I will forever cherish our memories together.",
                photos: [
                    { src: "scallywag1.jpg", caption: "Dance Practice" },
                    { src: "scallywag2.jpg", caption: "Stage Performance" },
                    { src: "scallywag3.jpg", caption: "Team Bonding" }
                ]
            },
            choir: {
                title: "Church Choir",
                description: "Serving the Lord through music and singing in our church choir brings so much peace and joy to my heart. I am glad that I met these people and I always enjoy singing in church with them, having breakfast together every after mass.",
                photos: [
                    { src: "choir1.jpg", caption: "Sunday Choir" },
                    { src: "choir2.jpg", caption: "Christmas Service" },
                    { src: "choir3.jpg", caption: "Rehearsal" }
                ]
            },
            friends: {
                title: "My Friends & Classmates",
                description: "I am also grateful that I met Shamila, the girl I met in 7th grade and became closed with in 2 years, I', very lucky to have her by my side, and my ride or die. I'm also grateful that I met my friends as well, who never fail to support me, who never bring me down, and never fail to make me laugh and brighten my day.",
                photos: [
                    { src: "friends1.jpg", caption: "Classroom Fun" },
                    { src: "friends2.jpg", caption: "Lunch Time" },
                    { src: "friends3.jpg", caption: "Group Project" },
                    { src: "friends4.jpg", caption: "School Event" }
                ]
            },
            taekwondo: {
                title: "Taekwondo Team",
                description: "I'm so glad to have the same sports with these peeps, I enjoy training with them, having a competition with them, and the peeps who always support me everytime I compete. and step on the mats.",
                photos: [
                    { src: "tkd1.jpg", caption: "Black Belt Practice" },
                    { src: "tkd2.jpg", caption: "Sparring Match" },
                    { src: "tkd3.jpg", caption: "Awarding Day" }
                ]
            }
        };

        let currentFolderKey = "";

        // Open Folder Gallery
        function openFolder(key) {
            currentFolderKey = key;
            const data = folderData[key];

            document.getElementById('bulletinBoard').style.display = 'none';
            document.getElementById('galleryView').style.display = 'block';
            document.getElementById('folderTitle').innerText = data.title;

            // Render horizontal polaroid photos
            const polaroidList = document.getElementById('polaroidList');
            polaroidList.innerHTML = "";

            data.photos.forEach(photo => {
                const item = document.createElement('div');
                item.className = 'polaroid-item';
                item.innerHTML = `
                    <img src="${photo.src}" alt="${photo.caption}" onclick="openImageModal('${photo.src}')">
                    <p>${photo.caption}</p>
                `;
                polaroidList.appendChild(item);
            });
        }

        // Return to Bulletin Board
        function closeFolder() {
            document.getElementById('galleryView').style.display = 'none';
            document.getElementById('bulletinBoard').style.display = 'block';
        }

        // Open Zoom Image Lightbox
        function openImageModal(imageSrc) {
            const modal = document.getElementById('imageModal');
            const zoomedImg = document.getElementById('zoomedImage');
            zoomedImg.src = imageSrc;
            modal.classList.add('active');
        }

        // Close Zoom Image Lightbox
        function closeImageModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('active');
        }

        // Open Description Modal
        function showDescriptionModal() {
            const data = folderData[currentFolderKey];
            document.getElementById('descTitle').innerText = data.title;
            document.getElementById('descText').innerText = data.description;
            document.getElementById('descModal').classList.add('active');
        }

        // Close Description Modal
        function closeDescriptionModal() {
            document.getElementById('descModal').classList.remove('active');
        }
    </script>
</body>
</html>
