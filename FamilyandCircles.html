<!-- FamilyandCircles.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family & Circles - Ma. Bernadette Pascua</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-overlay">
            <h1>Ma. Bernadette Pascua</h1>
            <p>9 - St. Padre Pio</p>
        </div>
    </header>

    <nav>
        <a href="LandingPage.html"><i class="fa-solid fa-house"></i> Home</a>
        <a href="AboutMe.html"><i class="fa-solid fa-user"></i> About Me</a>
        <a href="MyPassion.html"><i class="fa-solid fa-heart"></i> My Passion</a>
        <a href="FamilyandCircles.html" class="active"><i class="fa-solid fa-users"></i> Family & Circles</a>
    </nav>

    <main>
        <section class="bulletin-board" id="bulletinBoard">
            <h2>Family & Circles Bulletin</h2>
            <p class="bulletin-sub">Click a folder to view photos and memories!</p>

            <div class="folder-grid">
                <div class="folder-card" data-folder="family">
                    <i class="fa-solid fa-folder-open folder-icon"></i>
                    <h3>Family</h3>
                </div>

                <div class="folder-card" data-folder="scallywag">
                    <i class="fa-solid fa-folder-open folder-icon"></i>
                    <h3>Scallywag</h3>
                </div>

                <div class="folder-card" data-folder="choir">
                    <i class="fa-solid fa-folder-open folder-icon"></i>
                    <h3>Choir</h3>
                </div>

                <div class="folder-card" data-folder="friends">
                    <i class="fa-solid fa-folder-open folder-icon"></i>
                    <h3>Friends</h3>
                </div>

                <div class="folder-card" data-folder="taekwondo">
                    <i class="fa-solid fa-folder-open folder-icon"></i>
                    <h3>Taekwondo</h3>
                </div>
            </div>
        </section>

        <section class="gallery-container" id="galleryContainer" style="display: none;">
            <div class="gallery-header">
                <button class="back-btn" id="backToFoldersBtn">⬅ Back to Folders</button>
                <h2 id="galleryTitle">Group Title</h2>
            </div>

            <div class="polaroid-horizontal" id="polaroidList">
                <!-- Dynamically populated via script.js -->
            </div>

            <div class="gallery-footer">
                <button class="desc-btn" id="openDescBtn">Read Description</button>
            </div>
        </section>
    </main>

    <div class="desc-modal" id="descModal">
        <div class="desc-modal-content">
            <button class="modal-close-btn" id="closeDescBtn">✖</button>
            <h2 id="descTitle">Title</h2>
            <p id="descText">Description text goes here.</p>
        </div>
    </div>

    <div class="image-modal" id="imageModal">
        <div class="image-modal-backdrop" id="imageModalBackdrop"></div>
        <div class="modal-content-img">
            <img id="zoomedImage" src="" alt="Zoomed Photo">
        </div>
    </div>

    <div class="spotify-bar">
        <div class="spotify-left">
            <img src="assets/niki.png" alt="Album Cover" class="spotify-cover">
            <div class="spotify-track">
                <p class="track-title">Before <i class="fa-solid fa-circle-check verified-icon"></i></p>
                <p class="track-artist">NIKI</p>
            </div>
        </div>

        <div class="spotify-center">
            <audio controls src="assets/before-niki.mp3" class="spotify-audio">
                Your browser does not support the audio element.
            </audio>
        </div>

        <div class="spotify-right">
            <i class="fa-solid fa-microphone"></i>
            <i class="fa-solid fa-list-ul"></i>
            <i class="fa-solid fa-laptop"></i>
            <i class="fa-solid fa-volume-high"></i>
        </div>
    </div>

    <footer>
        <p>™ Gawa ni cute</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
